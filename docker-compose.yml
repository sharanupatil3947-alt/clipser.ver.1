version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipser-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./clipser.db
      - SECRET_KEY=clipser_production_secret_key_2026
    volumes:
      - ./storage:/app/storage
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clipser-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always
